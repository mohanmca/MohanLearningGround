0}.stitle{font-size:12px;line-height:1.25;font-weight:680}.content{overflow:auto;padding:26px}.slide{max-width:1050px;margin:auto}.module{display:inline-block;border-radius:99px;background:#dff3f5;color:#075e67;padding:5px 10px;font-size:12px;font-weight:800}.slide h1{font-size:clamp(25px,3vw,38px);line-height:1.12;margin:12px 0}.summary{font-size:17px;color:var(--muted);max-width:850px}.memory{margin:20px 0;padding:15px;border:1px solid #b9d5e8;border-left:5px solid var(--blue);border-radius:10px;background:#fff}.memory h2,.panel h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;margin:0 0 10px}.terms{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.term{padding:10px;background:#f4f8fb;border:1px solid var(--line);border-radius:8px}.term b{display:block;color:var(--blue);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}.term span{font-size:12px;color:var(--muted)}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.panel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:17px;margin:14px 0}.panel h3{margin-top:0}.callout{border-left:4px solid var(--amber);background:#fff8e8;padding:12px 14px;border-radius:0 8px 8px 0}.good{border-left-color:var(--green);background:#eefaf3}.danger{border-left-color:var(--red);background:#fff1f1}code{background:#edf2f6;border:1px solid var(--line);padding:2px 5px;border-radius:4px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:9px;border:1px solid var(--line);text-align:left;vertical-align:top}th{background:#edf4f8}.diagram{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;margin:15px 0}.diagram svg{width:100%;height:auto;display:block}.diagram figcaption{font-size:12px;color:var(--muted);margin-top:8px}.source{font-size:12px;color:var(--muted)}.source a{color:var(--blue)}.practice{background:#f6f0ff;border-color:#d7c8ed}.practice textarea{width:100%;min-height:74px;border:1px solid #cdbce7;border-radius:7px;padding:9px;background:#fff}.quiz{border:2px solid #b8dfca}.quiz .q{font-weight:750}.confidence{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}.options{display:grid;grid-template-columns:1fr 1fr;gap:8px}.option{padding:11px;border:1px solid var(--line);border-radius:8px;background:#fff;text-align:left}.option:hover{border-color:var(--blue);background:#eef7fc}.option.correct{border-color:var(--green);background:#eaf8f0}.option.wrong{border-color:var(--red);background:#fff0f0}.feedback{display:none;margin-top:12px;padding:12px;border-radius:8px;background:#eef4f8}.feedback.show{display:block}.feedback.bad{background:#fff0f0}.bottom{background:#fff;border-top:1px solid var(--line);padding:10px 18px;display:flex;align-items:center;justify-content:space-between}.bottom .stats{font-size:12px;color:var(--muted)}.modal{display:none;position:fixed;inset:0;background:rgba(12,26,42,.5);z-index:20;padding:4vh 4vw}.modal.open{display:grid;place-items:center}.dialog{background:#fff;width:min(850px,100%);max-height:90vh;overflow:auto;border-radius:12px;padding:22px}.dialog-head{display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;top:-22px;background:#fff;padding:10px 0}.glossary-item{padding:10px;border-bottom:1px solid var(--line)}.glossary-item b{color:var(--blue)}.hide{display:none!important}.hamb{display:none}.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.exam-q{border:1px solid var(--line);border-radius:10px;padding:15px;margin:14px 0}.exam-q legend{font-weight:750;padding:0 6px}.exam-options{display:grid;gap:7px;margin:10px 0}.exam-options label{padding:9px;border:1px solid var(--line);border-radius:7px}.exam-options label:hover{background:#eef7fc}.scorecard{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}.scorebox{padding:12px;border:1px solid var(--line);border-radius:9px;background:#f7fafc}.scorebox.strong{border-left:5px solid var(--green)}.scorebox.developing{border-left:5px solid var(--amber)}.scorebox.review{border-left:5px solid var(--red)}.remediation{padding:13px;border:1px solid #efcaca;border-left:5px solid var(--red);border-radius:8px;background:#fff6f6;margin:10px 0}.remediation.low{border-color:#ecd8a6;border-left-color:var(--amber);background:#fffaf0}.exam-actions{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
@media(max-width:850px){.top{grid-template-columns:1fr auto}.bars{grid-column:1/-1;grid-row:2}.main{grid-template-columns:1fr}.side{display:none;position:fixed;inset:0 25% 50px 0;z-index:10;box-shadow:4px 0 20px #789}.side.open{display:block}.hamb{display:inline-block}.terms,.grid2,.options,.scorecard{grid-template-columns:1fr}.content{padding:16px}.actions .optional{display:none}}

<script>
const STORE_KEY="um-design-persistence-workshop-v1";
const SOURCES={
  design:"https://ultramessaging.github.io/currdoc/doc/Design/html1/index.html",
  persistence:"https://ultramessaging.github.io/currdoc/doc/UME/html1/index.html"
};
const MODULE_NAMES=[
  "M1 · UM Mental Model",
  "M2 · Transport & Reliability Design",
  "M3 · Persistence Internals",
  "M4 · Durable Application Design",
  "M5 · Production Architecture",
  "M6 · Design Lab & Cumulative Review"
];
const CONCEPTS={
  paradigms:["Messaging paradigms","Streaming serves live participants; Persistence adds durable recovery; Queuing adds broker/load-balancing semantics."],
  objects:["UM objects","Contexts own runtime resources; sources publish topics; receivers subscribe; transport sessions carry one or more topics."],
  topicResolution:["Topic resolution","Sources advertise and receivers query/discover the transport information needed to join a topic stream."],
  transport:["Transport selection","Choose TCP, LBT-RU, LBT-RM, IPC, or SMX according to topology, fan-out, latency, and operational constraints."],
  reliability:["Bounded recovery","UDP transports detect gaps and request retransmission; recovery is time-bounded and can end in unrecoverable loss."],
  pacing:["Layered pacing","Transport pacing and persistence pacing are distinct controls; either can backpressure a publisher."],
  batching:["Batching","Combining small messages lowers per-message CPU and packet load; intelligent batching can avoid or reduce latency cost."],
  parallel:["Parallel Persistence","Sources send to receivers and Stores in parallel; the Store is not an inline broker on the live data path."],
  registration:["SRI registration","A source registers with Stores and advertises Store details in SRI so receivers can register and recover."],
  stability:["Stability and flight size","Messages remain in flight until the configured Store set acknowledges stability; flight size bounds outstanding data."],
  repositories:["Source repository","A Store maintains per-topic, per-source state and message data subject to size, age, and consumption policies."],
  sppRpp:["SPP versus RPP","SPP does not let receiver consumption pace the source; RPP can block the source when required receivers lag."],
  identity:["RegID and Session ID","Persistence identities reconnect durable source/receiver state; Session IDs are recommended for safer RegID management."],
  acknowledgements:["Consumption acknowledgement","Receiver acknowledgement mode determines when the Store considers a persistent message consumed."],
  quorum:["Quorum/Consensus","A QC group needs a majority of an odd number of configured Stores; sources define the group."],
  recovery:["Recovery design","Applications must plan resume points, duplicates, gaps, state lifetime, and behavior when components restart."],
  monitoring:["Monitoring-first design","Choose health signals, events, statistics, logs, and failure thresholds before implementation."],
  sizing:["Capacity model","Repository capacity depends on source count, rate, message size, recovery window, and storage behavior."],
  configuration:["Configuration planes","Applications use LBM configuration; Stores need Store XML plus LBM configuration for their internal UM objects."],
  tradeoffs:["End-to-end trade-offs","Transport, pacing, persistence mode, retention, recovery, and monitoring decisions must form one coherent design."]
};
const svg=(body,label)=>`<figure class="diagram"><svg viewBox="0 0 900 250" role="img" aria-label="${label}"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#315b75"/></marker></defs>${body}</svg><figcaption>${label}</figcaption></figure>`;
const node=(x,y,w,label,fill="#eaf4fb",stroke="#1769aa")=>`<rect x="${x}" y="${y}" width="${w}" height="58" rx="10" fill="${fill}" stroke="${stroke}" stroke-width="2"/><text x="${x+w/2}" y="${y+35}" text-anchor="middle" font-size="16" font-weight="700" fill="#132238">${label}</text>`;
const line=(x1,y1,x2,y2,label,dash="")=>`<path d="M${x1} ${y1} L${x2} ${y2}" stroke="#315b75" stroke-width="3" ${dash?`stroke-dasharray="${dash}"`:""} marker-end="url(#arrow)"/><text x="${(x1+x2)/2}" y="${(y1+y2)/2-8}" text-anchor="middle" font-size="13" fill="#425b70">${label}</text>`;
const SLIDES=[
{m:0,title:"Start with the delivery contract",summary:"Design Ultra Messaging from the application’s delivery promise backward—not from a favorite transport or configuration file.",concepts:["paradigms","tradeoffs","monitoring"],source:"design#messagingparadigms",body:`
<div class="grid2"><section class="panel"><h3>Three different contracts</h3><ul><li><b>Streaming:</b> reliable live delivery while participants and recovery windows are available.</li><li><b>Persistence:</b> Stores retain data/state so receivers can recover across absence or failure.</li><li><b>Queuing:</b> distribution and broker/ULB semantics solve a different problem.</li></ul></section><section class="panel"><h3>Design questions</h3><ol><li>May a subscriber be offline?</li><li>How much loss or duplication is acceptable?</li><li>How long must recovery remain possible?</li><li>What backpressure is permitted?</li></ol></section></div><div class="callout good"><b>Prediction:</b> If a receiver starts after the publisher exits, streaming alone cannot satisfy delivery; persistence is the required contract.</div>`,
prompt:"Write the one-sentence delivery contract for your own system.",q:{id:"q01",c:["paradigms","tradeoffs"],text:"A subscriber must recover messages published while it was stopped. Which paradigm is required?",options:["Persistence","Streaming only","Topic resolution only","Immediate messaging only"],explain:"Persistence is the UM quality of service that retains messages and state for recovery after absence or failure."}},
{m:0,title:"Objects, topics, and transport sessions",summary:"Topics express application meaning; transport sessions carry traffic. Multiple topics can share a transport session, so some configuration has session-wide effects.",concepts:["objects","transport","tradeoffs"],source:"design#umobjects",body:`
${svg(node(40,85,170,"Context")+node(300,30,170,"Source: orders")+node(300,145,170,"Source: trades")+node(690,85,170,"Transport Session")+line(210,114,300,59,"owns")+line(210,114,300,174,"owns")+line(470,59,690,105,"maps")+line(470,174,690,125,"maps"),"A context owns sources; multiple topic sources can map to one transport session.")}<div class="callout"><b>Operational implication:</b> options that appear source-scoped may affect the shared transport session selected by the first assigned source. Review session mapping before tuning one topic.</div>`,
prompt:"Explain the difference between a topic and a transport session without using the word “channel.”",q:{id:"q02",c:["objects","transport"],text:"Why can changing a source option unexpectedly affect another topic?",options:["Both topics may share a transport session whose settings come from the first assigned source","All topics always share one global receiver","RegIDs override transport configuration","Stores rewrite every source option"],explain:"A transport session can carry multiple topics, and several transport-related source options effectively configure that shared session."}},
{m:0,title:"Topic resolution is the control plane",summary:"Before data can flow, receivers must discover sources and the transport information associated with their topics.",concepts:["topicResolution","objects","registration"],source:"design#topicresolutiondescription",body:`
${svg(node(35,25,190,"Source advertises")+node(355,25,190,"Resolver / TRD","#f3effb","#6941a5")+node(675,25,190,"Receiver queries")+node(355,155,190,"Join transport","#eef9f3","#177245")+line(225,54,355,54,"TIR")+line(675,54,545,54,"interest")+line(675,84,545,184,"resolved info")+line(450,155,675,84,"join details"),"Topic resolution control flow: advertisement and query lead to transport-session discovery.")}<div class="grid2"><div class="panel"><h3>Initial phase</h3><p>Discover sources and transport details for matching topics.</p></div><div class="panel"><h3>Sustaining phase</h3><p>Maintain liveness and react to source or transport changes.</p></div></div>`,
prompt:"List one failure that is a topic-resolution problem and one that is a data-transport problem.",q:{id:"q03",c:["topicResolution","registration"],text:"What is the main output of topic resolution for a receiver?",options:["Information needed to discover and join the source’s transport session","A persisted copy of every message","A permanent RegID selected by the Store","A quorum vote from Store instances"],explain:"Topic resolution connects topic interest to current source and transport-session information; it is not message persistence."}},
{m:1,title:"Choose transport by topology and failure shape",summary:"TCP, reliable UDP, shared memory, and broker transports trade fan-out, locality, flow control, latency, and network requirements.",concepts:["transport","reliability","tradeoffs"],source:"design#transporttypes",body:`
<div class="panel"><table><thead><tr><th>Transport</th><th>Best fit</th><th>Design watchpoint</th></tr></thead><tbody><tr><td>TCP</td><td>Unicast, familiar flow control</td><td>Per-connection fan-out and receiver pacing choices</td></tr><tr><td>LBT-RU</td><td>Reliable UDP unicast</td><td>Source pacing and loss recovery</td></tr><tr><td>LBT-RM</td><td>Reliable multicast, large fan-out</td><td>Multicast availability and NAK-storm protection</td></tr><tr><td>LBT-IPC / SMX</td><td>Same-host low latency</td><td>Host resources and transport-specific restrictions</td></tr></tbody></table></div><div class="callout danger"><b>Anti-pattern:</b> choosing LBT-RM only because it benchmarks fastest, without validating multicast routing, receiver loss behavior, and recovery rate limits.</div>`,
prompt:"Choose a transport for 500 receivers across hosts, then name the network assumption that must be validated.",q:{id:"q04",c:["transport","tradeoffs","reliability"],text:"Which transport is designed for reliable multicast and scalable fan-out?",options:["LBT-RM","LBT-RU","LBT-IPC","TCP topic resolution"],explain:"LBT-RM adds reliability to multicast UDP and uses network replication for scalable fan-out, subject to multicast availability."}},
{m:1,title:"Reliability is detection + bounded repair",summary:"Reliable delivery detects sequence gaps, requests retransmission, orders results, and eventually declares unrecoverable loss when the recovery window expires.",concepts:["reliability","transport","recovery"],source:"design#messagingreliability",body:`
${svg(node(30,35,160,"Receive 100")+node(250,35,160,"Gap: 101")+node(470,35,160,"Receive 102")+node(690,35,170,"Deliver / declare")+line(190,64,250,64,"TSNI gap")+line(410,64,470,64,"NAK / retry")+line(630,64,690,64,"bounded result")+`<path d="M550 120 C550 205 330 205 330 95" fill="none" stroke="#a43131" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow)"/><text x="440" y="205" text-anchor="middle" fill="#a43131" font-size="14">retransmission path</text>`,"Loss recovery is time-bounded: a gap triggers repair, then delivery or an unrecoverable-loss event.")}<p class="callout">In-order delivery may hold later messages behind a gap. Arrival-order delivery reduces that blocking but changes the application’s ordering contract.</p>`,
prompt:"Describe what the application should do when recovery times out and an unrecoverable-loss event enters the stream.",q:{id:"q05",c:["reliability","recovery"],text:"Why is transport recovery described as time-bounded?",options:["A receiver waits only a configured period before reporting data as unrecoverable","Every retransmission must finish in one CPU tick","Stores delete all messages after one timeout","Topic resolution disables retransmissions after discovery"],explain:"UM recovery waits within configured timing limits; if repair cannot complete, loss becomes an ordered application-visible event."}},
{m:1,title:"Pacing layers compose",summary:"Transport pacing protects the network or receivers; persistence pacing protects Stores and recovery obligations. A publisher experiences the tightest active constraint.",concepts:["pacing","stability","sppRpp"],source:"design#pacingandpersistence",body:`
${svg(node(35,80,170,"Publisher")+node(360,25,180,"Transport gate","#fff5e5","#a45b00")+node(360,145,180,"Persistence gate","#f3effb","#6941a5")+node(695,80,170,"Send allowed?")+line(205,109,360,54,"rate / flow")+line(205,109,360,174,"flight / Store")+line(540,54,695,99,"constraint")+line(540,174,695,119,"constraint"),"Layered pacing: transport and persistence constraints independently gate publisher progress.")}<div class="callout danger"><b>Diagnosis rule:</b> a blocked send is a symptom, not a root cause. Separate transport rate/flow control, Store stability delay, full flight size, RPP receiver lag, and repository limits.</div>`,
prompt:"When a publisher blocks, write the first three measurements you would inspect.",q:{id:"q06",c:["pacing","stability","sppRpp"],text:"With persistence enabled, how is publisher pacing applied?",options:["Transport pacing and persistence pacing are layered","Persistence replaces all transport pacing","Only receivers can apply pacing","The Store always buffers without limits"],explain:"The Concepts Guide describes layered pacing: the selected transport has its pacing behavior and persistence adds source-to-Store protection."}},
{m:1,title:"Batch packets, not reasoning",summary:"Batching reduces packet and per-message CPU costs. Tune it against message rate, size, latency objectives, and platform behavior.",concepts:["batching","pacing","tradeoffs"],source:"design#messagebatching",body:`
<div class="grid2"><section class="panel"><h3>Without batching</h3><p>Many small messages → many packets → high per-message sender/receiver CPU.</p></section><section class="panel"><h3>With batching</h3><p>Fewer, fuller packets → higher throughput. Intelligent batching may add little latency and can sometimes reduce average latency.</p></section></div><div class="panel"><table><tr><th>Observe</th><th>If unhealthy</th><th>Experiment</th></tr><tr><td>Packets/sec, CPU, bundle size</td><td>High CPU at small payloads</td><td>Implicit or intelligent batching</td></tr><tr><td>Tail latency</td><td>Wait interval dominates</td><td>Reduce interval or use adaptive policy</td></tr></table></div>`,
prompt:"State a batching hypothesis that includes both a throughput metric and a latency guardrail.",q:{id:"q07",c:["batching","tradeoffs"],text:"What is the principal performance benefit of source-side batching?",options:["It reduces per-message CPU and packet overhead","It persists messages in compressed form","It assigns durable RegIDs","It removes the need for loss recovery"],explain:"Batching combines small messages into fewer packets, lowering per-message work at both sender and receiver."}},
{m:2,title:"Parallel Persistence keeps the live path direct",summary:"Sources send data to receivers and Store instances in parallel. Stores preserve recoverability without becoming an inline hop for normal live delivery.",concepts:["parallel","paradigms","tradeoffs"],source:"persistence#persistenceoverview",body:`
${svg(node(25,85,170,"Source")+node(365,20,170,"Store","#f3effb","#6941a5")+node(705,85,170,"Receiver","#eef9f3","#177245")+line(195,114,705,114,"live data")+line(195,95,365,49,"persist copy")+line(535,49,705,95,"recovery","8 6"),"Parallel Persistence: live data travels directly to receivers while Stores retain copies for recovery.")}<div class="callout good">The Store is an independent component. A failed persistent source can restart while the Store retains its state and messages according to retention policy.</div>`,
prompt:"Explain Parallel Persistence to someone who assumes every durable system must route live traffic through a broker.",q:{id:"q08",c:["parallel","paradigms"],text:"During normal Parallel Persistence, where does live message data flow?",options:["From the source directly to receivers and in parallel to Stores","Only source → Store → receiver","Only through topic-resolution packets","From receivers back through the source"],explain:"The source transmits to receivers and Stores in parallel; the Store is used when recovery is needed."}},
{m:2,title:"Two configuration planes, three object owners",summary:"Applications configure their UM objects with LBM options. A Store process needs Store XML and LBM configuration for its own internal UM objects.",concepts:["configuration","objects","repositories"],source:"persistence#persistenceconfigurationconcept",body:`
<div class="panel"><table><thead><tr><th>Owner</th><th>Configuration</th><th>Controls</th></tr></thead><tbody><tr><td>Application</td><td>LBM flat/XML</td><td>Contexts, sources, receivers, transports, persistence client behavior</td></tr><tr><td>Store process</td><td>Store XML</td><td>Store instances, topics, repositories, directories, monitor</td></tr><tr><td>Store internal UM objects</td><td>LBM configuration</td><td>Store-side contexts, sources, receivers, network behavior</td></tr></tbody></table></div><div class="callout danger">Changing the right option in the wrong configuration plane produces a convincing no-op. Always record option scope and owning object.</div>`,
prompt:"For one tuning option, write its owner, scope, configuration file, and restart/reload requirement.",q:{id:"q09",c:["configuration","objects"],text:"Which configuration does a Store process require?",options:["Store XML plus LBM configuration for its internal UM objects","Only the application’s source options","Only environment variables","Only receiver RegIDs"],explain:"Stores have Store-specific XML configuration and also create UM objects that require LBM configuration."}},
{m:2,title:"Registration: source first, receiver via SRI",summary:"The source registers with Store instances, then publishes Source Registration Information so receivers know which Stores and identities to use.",concepts:["registration","topicResolution","identity"],source:"persistence#generalpersistenceoperation",body:`
${svg(node(20,30,160,"Source")+node(370,30,160,"Store")+node(720,30,160,"Receiver")+line(180,59,370,59,"1 register")+line(180,110,720,110,"2 SRI over transport")+line(720,165,530,165,"3 receiver register")+`<path d="M530 165 L530 88" stroke="#315b75" stroke-width="3" marker-end="url(#arrow)"/>`,"Persistence registration sequence: source registers, sends SRI, then receiver registers with Stores.")}<div class="panel"><h3>SRI carries</h3><p>Domain ID, Store IP and TCP port, Store/group indexes, source RegID, and overall/per-Store version numbers. Higher versions drive selective re-registration.</p></div><div class="callout danger"><code>request_tcp_bind_request_port=0</code> disables request-port binding and therefore disables persistence.</div>`,
prompt:"Teach back why a receiver cannot complete persistent registration before it receives SRI.",q:{id:"q10",c:["registration","topicResolution","identity"],text:"What enables a receiver to register with the correct Store instances?",options:["SRI sent by the source over its transport","Repository age threshold","A batching interval","The receiver inventing Store addresses"],explain:"SRI carries the Store and source-registration details that the receiver needs for Store registration."}},
{m:2,title:"Stability, retention, and flight size",summary:"A message is stable when the required Store set has persisted and acknowledged it. Until then, it remains in flight and contributes to publisher retention pressure.",concepts:["stability","pacing","repositories"],source:"persistence#messagestabilityconcept",body:`
${svg(node(25,80,170,"Send seq 900")+node(270,80,170,"In flight","#fff5e5","#a45b00")+node(515,80,170,"Store stable","#f3effb","#6941a5")+node(730,80,145,"Reclaim","#eef9f3","#177245")+line(195,109,270,109,"send")+line(440,109,515,109,"write")+line(685,109,730,109,"ACK"),"Message lifecycle: send, in-flight retention, Store stability acknowledgement, then eligibility for reclaim.")}<div class="callout">Reclaiming from source memory does not mean the message is unrecoverable; it should happen only after the retention rules, including Store stability, permit it.</div>`,
prompt:"Draw the boundary between “sent,” “stable,” “consumed,” and “reclaimable.”",q:{id:"q11",c:["stability","pacing"],text:"What does persistence flight size limit?",options:["Messages sent but not yet acknowledged stable by the required persistence condition","The number of topics in a TRD","The number of receiver callback threads","The number of glossary concepts"],explain:"Flight size bounds outstanding messages awaiting the relevant Store stability/retention acknowledgements."}},
{m:2,title:"Repositories are per source, not merely per topic",summary:"A Store instance creates a separate repository for each source publishing on a configured topic. Capacity therefore multiplies with active source count.",concepts:["repositories","sizing","configuration"],source:"persistence#sourcerepositories",body:`
<div class="panel"><table><thead><tr><th>Policy</th><th>SPP consequence</th><th>RPP consequence</th></tr></thead><tbody><tr><td>Size limit</td><td>Oldest retained disk data may be overwritten according to policy</td><td>Source can be prevented from sending when required consumption has not advanced</td></tr><tr><td>Age threshold</td><td>Bounds retention window where supported</td><td>Consumption, not age, drives removal</td></tr><tr><td>All required receivers consumed</td><td>Not the pacing contract</td><td>Allows removal and advances capacity</td></tr></tbody></table></div><div class="callout danger"><b>Sizing trap:</b> 48 MB configured for a topic with ten active sources can require roughly 480 MB because each source gets its own repository.</div>`,
prompt:"Estimate capacity using source count × rate × average message size × recovery window, then add operational headroom.",q:{id:"q12",c:["repositories","sizing"],text:"A topic has ten persistent sources and a 48 MB repository size per source. What is the approximate topic allocation?",options:["480 MB","48 MB","4.8 MB","The source count has no effect"],explain:"Repositories are created per topic per source, so ten sources each receiving 48 MB require about 480 MB."}},
{m:3,title:"SPP and RPP encode different business promises",summary:"Source-paced persistence favors continued publishing and bounded history. Receiver-paced persistence makes required receiver consumption part of the send-progress contract.",concepts:["sppRpp","pacing","repositories"],source:"persistence#rppreceiverpacedpersistence",body:`
<div class="grid2"><section class="panel"><h3>SPP · default</h3><ul><li>Receiver rate does not constrain source rate.</li><li>Store writes messages and retains bounded history.</li><li>When storage rolls, oldest recovery data can be overwritten.</li></ul></section><section class="panel"><h3>RPP · optional</h3><ul><li>Required receiver progress can constrain the source.</li><li>Store writes when required receivers are absent or slow.</li><li>Full repository can block sending.</li></ul></section></div>`,
prompt:"Choose SPP or RPP for a market-data feed and for a must-consume settlement workflow; justify each.",q:{id:"q13",c:["sppRpp","pacing"],text:"Which statement correctly distinguishes RPP from SPP?",options:["RPP can constrain the source based on required receiver consumption","SPP requires every receiver to acknowledge before sending continues","RPP never writes messages to a Store","SPP has no repository limits"],explain:"RPP adds receiver-paced durability semantics; required receiver lag can eventually backpressure the source."}},
{m:3,title:"Durable identity must survive process identity",summary:"RegIDs bind sources and receivers to Store state. Reusing or colliding identities can be destructive, so the documentation recommends managing them with Session IDs.",concepts:["identity","registration","recovery"],source:"persistence#registrationidentifiers",body:`
<div class="panel"><h3>Identity invariants</h3><ul><li>A RegID is a 32-bit identifier unique among active sources or receivers for a Store instance.</li><li>Restarted applications must reconnect to the intended durable state, not silently become a new identity.</li><li>Session IDs provide a safer management approach than ad hoc static RegID allocation.</li></ul></div><div class="callout danger"><b>Failure mode:</b> two active clients reuse one RegID, or a restarted client uses a new identity and strands its prior recovery state.</div>`,
prompt:"Define how your deployment allocates, stores, restores, and retires durable identities.",q:{id:"q14",c:["identity","recovery"],text:"Why are Session IDs recommended for persistence identity management?",options:["They reduce risky direct RegID management and help reconnect durable state safely","They increase multicast packet size","They replace Store repositories","They disable duplicate delivery"],explain:"The Persistence Guide warns that RegIDs are powerful and potentially destructive; Session IDs are the recommended management mechanism."}},
{m:3,title:"Acknowledgement timing is an application contract",summary:"Receiver consumption acknowledgements tell the Store how far durable processing has advanced. Acknowledge after the business point you are prepared to recover from.",concepts:["acknowledgements","recovery","sppRpp"],source:"persistence#persistencemessageconsumption",body:`
<div class="panel"><table><thead><tr><th>Approach</th><th>Use when</th><th>Risk</th></tr></thead><tbody><tr><td>Delete on return / batch ACK</td><td>Callback completion equals consumption</td><td>Business side effect may still be pending</td></tr><tr><td>Retain on return</td><td>Processing outlives callback</td><td>Must release correctly</td></tr><tr><td>Explicit ACK</td><td>Application owns the commit boundary</td><td>Incorrect ordering or missing ACK stalls progress</td></tr></tbody></table></div><div class="callout">“Delivered to callback” and “durably applied by the business” are not automatically the same event.</div>`,
prompt:"Name the exact side effect after which your receiver may safely acknowledge consumption.",q:{id:"q15",c:["acknowledgements","recovery"],text:"When should an application use explicit acknowledgements?",options:["When it must align Store consumption with an application-controlled processing/commit boundary","Whenever it wants to disable recovery","Only for streaming without Stores","To choose a multicast address"],explain:"Explicit acknowledgement lets the application define when processing is complete enough to advance durable consumption."}},
{m:3,title:"Recovery can legitimately deliver duplicates",summary:"Source/receiver restart, uncertain acknowledgement boundaries, and replay can produce duplicates. Design idempotency and sequence handling rather than assuming exactly-once effects.",concepts:["recovery","identity","acknowledgements"],source:"persistence#duplicatemessagedelivery",body:`
${svg(node(25,35,180,"Apply seq 500")+node(355,35,180,"Crash before ACK","#fff1f1","#a43131")+node(695,35,180,"Replay seq 500","#f3effb","#6941a5")+line(205,64,355,64,"side effect")+line(535,64,695,64,"recovery")+node(355,160,180,"Idempotency key","#eef9f3","#177245")+line(785,93,535,179,"dedupe"),"Duplicate-safe recovery: a side effect can succeed before its acknowledgement; replay must be idempotent.")}<div class="callout good">Use an application message ID or business key, persist the effect and deduplication record atomically where possible, and monitor duplicate rate.</div>`,
prompt:"Write the idempotency key and atomic commit boundary for one message type.",q:{id:"q16",c:["recovery","acknowledgements"],text:"Why must a persistent receiver tolerate duplicate delivery?",options:["A crash can occur after applying a message but before its durable consumption acknowledgement is recorded","Topic resolution always duplicates every packet","QC requires each Store to deliver a copy to the application","Batching converts one message into two"],explain:"At-least-once recovery boundaries can replay a message whose business effect completed but whose acknowledgement did not."}},
{m:4,title:"Quorum/Consensus tolerates Store failure—not bad math",summary:"Sources define an odd-sized QC Store group and require a majority for continued stability. Store instances in the group should run on separate physical hosts.",concepts:["quorum","stability","tradeoffs"],source:"persistence#quorumconsensusstorefailover",body:`
${svg(node(25,90,150,"Source")+node(290,25,150,"Store A","#eef9f3","#177245")+node(290,95,150,"Store B","#eef9f3","#177245")+node(290,165,150,"Store C","#fff1f1","#a43131")+node(690,90,170,"2 of 3 = quorum","#f3effb","#6941a5")+line(175,119,290,54,"write")+line(175,119,290,124,"write")+line(175,119,290,194,"failed","8 6")+line(440,54,690,105,"ACK")+line(440,124,690,115,"ACK"),"A three-Store QC group continues with two operational Stores; the majority is defined by the source configuration.")}<div class="callout danger">Three Store instances on one host protect against a process failure, not a host failure. Fault domains must be physically independent.</div>`,
prompt:"For three Stores, list the failures the design survives and the correlated failures it does not.",q:{id:"q17",c:["quorum","stability"],text:"How many operational Stores are needed for quorum in a three-Store QC group?",options:["2","1","3","0"],explain:"Quorum is a majority: two of three. The guide specifies odd-sized groups and recommends separate physical hosts."}},
{m:4,title:"Capacity is a recovery-window calculation",summary:"Repository thresholds should keep hard limits from becoming the normal control mechanism. Size from traffic and failure objectives, then validate with observed write/read behavior.",concepts:["sizing","repositories","monitoring"],source:"persistence#repositorythresholdsandlimits",body:`
<div class="panel"><h3>First-order estimate</h3><p><code>capacity ≈ sources × messages/sec × bytes/message × recovery seconds × overhead factor</code></p><table><tr><th>Input</th><th>Measure, do not guess</th></tr><tr><td>Source count</td><td>Concurrent persisted sources per matching topic/repository rule</td></tr><tr><td>Rate and size</td><td>Average plus burst and percentile payload sizes</td></tr><tr><td>Recovery window</td><td>Maximum outage plus restart and catch-up time</td></tr><tr><td>Headroom</td><td>Filesystem, cache, index/state, growth, and burst allowance</td></tr></table></div>`,
prompt:"Calculate a sample repository requirement and state which percentile or burst assumption dominates it.",q:{id:"q18",c:["sizing","repositories"],text:"What should repository thresholds accomplish?",options:["Keep normal operation away from the hard size limit while preserving the required recovery window","Force the publisher to hit the limit regularly","Make source count irrelevant","Replace monitoring"],explain:"The guide recommends thresholds and capacity choices that prevent the hard limit from being reached in normal operation."}},
{m:4,title:"Monitor the contracts, not just the processes",summary:"A running process can still violate delivery, stability, recovery, or latency objectives. Monitoring must join application events, UM statistics, Store logs, and resource signals.",concepts:["monitoring","stability","recovery"],source:"design#ummonitoring",body:`
<div class="panel"><table><thead><tr><th>Contract</th><th>Signals</th><th>Question</th></tr></thead><tbody><tr><td>Discovery</td><td>Source/receiver resolution, BOS/EOS</td><td>Can participants find and join?</td></tr><tr><td>Stability</td><td>Flight size, stability events, Store liveness</td><td>Are messages becoming durable?</td></tr><tr><td>Recovery</td><td>Recovery requests, unrecoverable loss, duplicates</td><td>Can consumers catch up?</td></tr><tr><td>Capacity</td><td>Repository/cache/disk, ACK lag</td><td>Will the recovery window hold?</td></tr></tbody></table></div><div class="callout good">The Concepts Guide recommends deciding on a monitoring approach before coding applications.</div>`,
prompt:"Define one alert for each contract: discovery, stability, recovery, and capacity.",q:{id:"q19",c:["monitoring","recovery"],text:"When should a UM monitoring approach be selected?",options:["During application design, before coding","Only after the first production incident","Only when a Store crashes","After repository limits are reached"],explain:"The Concepts Guide explicitly recommends deciding the monitoring approach before application implementation."}},
{m:5,title:"Design lab: make the whole system agree",summary:"Use one coherent decision record: delivery contract → topology → transport → pacing → persistence mode → identity → recovery → capacity → monitoring.",concepts:["tradeoffs","configuration","monitoring"],source:"persistence#configuringforpersistenceandrecovery",body:`
<div class="panel"><h3>Scenario</h3><p>A publisher emits 80,000 orders/sec. Three regional consumers must recover a 20-minute outage. One consumer may lag, but publishing must not stop. Duplicate business effects are forbidden. Multicast is available inside each region.</p></div><div class="panel"><h3>Your decision record</h3><ol><li>Select transport and topic-resolution shape.</li><li>Select SPP or RPP and explain the backpressure consequence.</li><li>Define Store/QC fault domains and repository window.</li><li>Define receiver identity, ACK boundary, and idempotency key.</li><li>Define four alerts and one failure drill.</li></ol></div><div class="callout"><b>Suggested direction:</b> the “publishing must not stop because one consumer lags” condition points away from making that consumer required under RPP. Validate whether SPP’s bounded history satisfies the actual loss contract.</div>`,
prompt:"Write a five-line architecture decision record for the scenario before answering the final question.",q:{id:"q20",c:["tradeoffs","configuration","monitoring","batching","parallel","quorum"],text:"Which design process is strongest for this scenario?",options:["Derive transport, persistence, recovery, capacity, and monitoring choices from one explicit delivery contract","Choose the fastest transport benchmark and add durability later","Use RPP automatically because it sounds safer","Treat a running Store process as proof of end-to-end health"],explain:"A sound UM design aligns every mechanism with the application contract and verifies it through monitoring and failure drills."}}
];

const PASS_SCORE=80;
let state={index:0,answers:{},notes:{},attempts:{},conceptHits:{},examAttempts:[]};
try{state={...state,...JSON.parse(localStorage.getItem(STORE_KEY)||"{}")}}catch(e){}
function save(){localStorage.setItem(STORE_KEY,JSON.stringify(state))}
function hash(s){let h=2166136261;for(const ch of s){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function shuffled(q){return q.options.map((v,i)=>({v,i})).sort((a,b)=>hash(q.id+a.v)-hash(q.id+b.v))}
function status(i){const a=state.answers[SLIDES[i].q.id];if(!a)return i===state.index?"active":"unseen";return a.correct?"practicing":"struggling"}
function conceptState(id){const h=state.conceptHits[id]||0;const seen=SLIDES.some((s,i)=>s.concepts.includes(id)&&state.answers[s.q.id]);if(h>=2)return"mastered";if(h===1)return"practicing";if(seen)return"struggling";return"unseen"}
function sourceLink(s){const [key,anchor]=s.source.split("#");return `${SOURCES[key]}#${anchor}`}
function render(){
 const s=SLIDES[state.index],q=s.q,a=state.answers[q.id],opts=shuffled(q);
 document.getElementById("slide").innerHTML=`<span class="module">${MODULE_NAMES[s.m]}</span><h1>${state.index+1}. ${s.title}</h1><p class="summary">${s.summary}</p>
 <section class="memory"><h2>Concepts to retrieve later</h2><div class="terms">${s.concepts.map(id=>`<div class="term"><b>${CONCEPTS[id][0]}</b><span>${CONCEPTS[id][1]}</span></div>`).join("")}</div></section>
 ${s.body}
 <section class="panel practice"><h2>Pause, predict, teach back</h2><p>${s.prompt}</p><label class="sr" for="note">Your response</label><textarea id="note" oninput="saveNote(this.value)" placeholder="Write before revealing the quiz answer…">${escapeHtml(state.notes[state.index]||"")}</textarea></section>
 <section class="panel quiz"><h2>Retrieval check</h2><p class="q">${q.text}</p><div class="confidence"><b>Confidence before reveal:</b>${[1,2,3].map(n=>`<label><input type="radio" name="confidence" value="${n}" ${a&&a.confidence==n?"checked":""} ${a?"disabled":""}> ${n===1?"Low":n===2?"Medium":"High"}</label>`).join("")}</div>
 <div class="options">${opts.map(o=>`<button class="option ${a?(o.i===0?"correct":a.selected===o.i?"wrong":""):""}" ${a?"disabled":""} onclick="answer(${o.i})">${o.v}</button>`).join("")}</div>
 <div class="feedback ${a?"show":""} ${a&&!a.correct?"bad":""}">${a?`<b>${a.correct?"Correct.":"Not yet."}</b> ${q.explain}${!a.correct?` <button class="btn" onclick="clearAnswer('${q.id}')">Try a different question path</button>`:""}`:"Choose a confidence level, then answer."}</div></section>
 <p class="source">Source: <a href="${sourceLink(s)}" target="_blank" rel="noopener">${s.source.startsWith("design")?"UM Concepts Guide":"UME Guide for Persistence"} · ${s.title}</a></p>`;
 renderSteps();updateProgress();save();document.getElementById("content").scrollTop=0;
}
function renderSteps(){document.getElementById("steps").innerHTML=SLIDES.map((s,i)=>`<button class="step ${i===state.index?"active":""} ${status(i)}" onclick="jump(${i})"><span class="node">${state.answers[s.q.id]?.correct?"✓":i+1}</span><span><span class="meta">${MODULE_NAMES[s.m]}</span><span class="stitle">${s.title}</span></span></button>`).join("")}
function answer(selected){const confidence=Number(document.querySelector('input[name="confidence"]:checked')?.value||0);if(!confidence){alert("Rate your confidence before revealing the answer.");return}const q=SLIDES[state.index].q,correct=selected===0;state.answers[q.id]={selected,correct,confidence};state.attempts[q.id]=(state.attempts[q.id]||0)+1;if(correct)q.c.forEach(id=>state.conceptHits[id]=(state.conceptHits[id]||0)+1);render()}
function clearAnswer(id){const prev=state.answers[id];if(prev?.correct)SLIDES.find(s=>s.q.id===id).q.c.forEach(c=>state.conceptHits[c]=Math.max(0,(state.conceptHits[c]||0)-1));delete state.answers[id];render()}
function saveNote(v){state.notes[state.index]=v;save()}
function go(d){jump(Math.max(0,Math.min(SLIDES.length-1,state.index+d)))}
function jump(i){state.index=i;document.getElementById("side").classList.remove("open");render();document.getElementById("content").focus()}
function updateProgress(){const pos=Math.round((state.index+1)/SLIDES.length*100),mastered=Object.keys(CONCEPTS).filter(id=>conceptState(id)==="mastered").length,mp=Math.round(mastered/Object.keys(CONCEPTS).length*100);positionFill.style.width=pos+"%";positionPct.textContent=pos+"%";masteryFill.style.width=mp+"%";masteryPct.textContent=mp+"%";stats.textContent=`Step ${state.index+1} of ${SLIDES.length} · ${mastered} of ${Object.keys(CONCEPTS).length} concepts mastered`}
function retryWeak(){const i=SLIDES.findIndex(s=>state.answers[s.q.id]&&!state.answers[s.q.id].correct);if(i>=0)jump(i);else alert("No failed checks. Revisit concepts marked practicing for a second-context retrieval.")}
function toggleSide(){side.classList.toggle("open")}
function openGlossary(){renderGlossary();glossaryModal.classList.add("open");glossarySearch.focus()}
function closeGlossary(){glossaryModal.classList.remove("open")}
function renderGlossary(){glossaryList.innerHTML=Object.entries(CONCEPTS).sort((a,b)=>a[1][0].localeCompare(b[1][0])).map(([id,c])=>`<div class="glossary-item" data-search="${(c[0]+" "+c[1]).toLowerCase()}"><b>${c[0]}</b> <small>· ${conceptState(id)}</small><div>${c[1]}</div><small>Steps ${SLIDES.map((s,i)=>s.concepts.includes(id)?i+1:null).filter(Boolean).join(", ")}</small></div>`).join("")}
function filterGlossary(){const q=glossarySearch.value.toLowerCase();document.querySelectorAll(".glossary-item").forEach(x=>x.classList.toggle("hide",!x.dataset.search.includes(q)))}
function selectExamQuestions(attempt,focusedModules=null){
 const modules=focusedModules||[0,1,2,3,4,5],selected=[];
 modules.forEach(m=>{const pool=EXAM_BANK.filter(q=>q.moduleId===m),count=focusedModules?1:2;for(let i=0;i<count;i++)selected.push(pool[(attempt-1+i)%pool.length])});
 return selected.sort((a,b)=>hash(`exam-${attempt}-${a.id}`)-hash(`exam-${attempt}-${b.id}`));
}
function startExam(focused=false){
 const prior=state.examAttempts||[],attempt=prior.length+1,last=prior[prior.length-1],focusedModules=focused&&last?[...new Set(last.results.filter(r=>!r.correct||r.confidence===1).map(r=>r.moduleId))]:null;
 if(focused&&(!focusedModules||!focusedModules.length)){alert("No weak modules remain for a focused retry.");return}
 const questions=selectExamQuestions(attempt,focusedModules);
 state.exam={attempt,focused,questionIds:questions.map(q=>q.id),answers:{},submitted:false};save();examModal.classList.add("open");renderExam();
}
function closeExam(){examModal.classList.remove("open")}
function renderExam(){
 const e=state.exam;if(!e){examBody.innerHTML=`<p>No exam is active.</p><button class="btn primary" onclick="startExam(false)">Start exam</button>`;return}
 if(e.submitted){renderExamResults(e.summary);return}
 const questions=e.questionIds.map(id=>EXAM_BANK.find(q=>q.id===id));
 examBody.innerHTML=`<p>${e.focused?"Focused retry":"Cumulative exam"} · Attempt ${e.attempt} · ${questions.length} questions · Pass ${PASS_SCORE}%</p><p class="callout">Answer from memory. Each question requires a confidence rating. Exam scenarios differ from the in-slide checks.</p>
 ${questions.map((q,n)=>`<fieldset class="exam-q"><legend>${n+1}. ${q.prompt}</legend><div class="exam-options">${shuffled(q).map(o=>`<label><input type="radio" name="exam-${q.id}" value="${o.i}" ${e.answers[q.id]?.selected===o.i?"checked":""} onchange="setExamAnswer('${q.id}',${o.i})"> ${o.v}</label>`).join("")}</div><label>Confidence <select onchange="setExamConfidence('${q.id}',this.value)"><option value="">Choose…</option><option value="1" ${e.answers[q.id]?.confidence===1?"selected":""}>Low</option><option value="2" ${e.answers[q.id]?.confidence===2?"selected":""}>Medium</option><option value="3" ${e.answers[q.id]?.confidence===3?"selected":""}>High</option></select></label></fieldset>`).join("")}
 <div class="exam-actions"><button class="btn primary" onclick="submitExam()">Submit exam</button><button class="btn" onclick="closeExam()">Save and close</button></div>`;
}
function setExamAnswer(id,selected){state.exam.answers[id]={...(state.exam.answers[id]||{}),selected};save()}
function setExamConfidence(id,value){state.exam.answers[id]={...(state.exam.answers[id]||{}),confidence:Number(value)};save()}
function submitExam(){
 const e=state.exam,questions=e.questionIds.map(id=>EXAM_BANK.find(q=>q.id===id)),missing=questions.filter(q=>e.answers[q.id]?.selected===undefined||!e.answers[q.id]?.confidence);
 if(missing.length){alert(`Complete the answer and confidence for ${missing.length} question(s).`);return}
 const results=questions.map(q=>{const a=e.answers[q.id];return{id:q.id,moduleId:q.moduleId,conceptIds:q.conceptIds,selected:a.selected,confidence:a.confidence,correct:a.selected===0}});
 const score=Math.round(results.filter(r=>r.correct).length/results.length*100),moduleScores={};
 for(let m=0;m<6;m++){const rs=results.filter(r=>r.moduleId===m);if(!rs.length)continue;const pct=Math.round(rs.filter(r=>r.correct).length/rs.length*100),confidentWrong=rs.some(r=>!r.correct&&r.confidence===3);moduleScores[m]={pct,band:confidentWrong||pct<60?"review":pct<80?"developing":"strong",confidentWrong}}
 const summary={attempt:e.attempt,focused:e.focused,score,passed:score>=PASS_SCORE,results,moduleScores,completedAt:new Date().toISOString()};
 state.examAttempts.push(summary);state.exam.submitted=true;state.exam.summary=summary;save();renderExamResults(summary);
}
function renderExamResults(summary){
 const priority=summary.results.filter(r=>!r.correct||r.confidence===1).sort((a,b)=>(!b.correct&&b.confidence===3)-(!a.correct&&a.confidence===3)||Number(a.correct)-Number(b.correct));
 examBody.innerHTML=`<h3>${summary.focused?"Focused retry":"Final exam"}: ${summary.score}% · ${summary.passed?"Passed":"Review before retake"}</h3>
 <div class="scorecard">${Object.entries(summary.moduleScores).map(([m,s])=>`<div class="scorebox ${s.band}"><b>${MODULE_NAMES[m]}</b><div>${s.pct}% · ${s.band==="review"?"review required":s.band}</div>${s.confidentWrong?"<small>Confident misconception detected</small>":""}</div>`).join("")}</div>
 <h3>Personalized review plan</h3>${priority.length?priority.map(r=>{const q=EXAM_BANK.find(x=>x.id===r.id),kind=!r.correct&&r.confidence===3?"Confident but wrong":!r.correct?"Incorrect":"Correct with low confidence";return`<div class="remediation ${r.correct?"low":""}"><b>${kind} · ${MODULE_NAMES[q.moduleId]}</b><p>${q.misconception}</p><p><b>Correct reasoning:</b> ${q.explanation}</p><p><b>Review:</b> ${q.reviewSlides.map(n=>`Step ${n}`).join(", ")}</p><div class="exam-actions">${q.reviewSlides.map(n=>`<button class="btn" onclick="reviewStep(${n})">Open step ${n}</button>`).join("")}</div></div>`}).join(""):`<p class="callout good">No failed or low-confidence answers. Revisit mastered concepts later for spaced retrieval.</p>`}
 <div class="exam-actions">${priority.length?`<button class="btn primary" onclick="startExam(true)">Focused retry with alternate questions</button>`:""}<button class="btn" onclick="startExam(false)">Full retake with alternate questions</button><button class="btn" onclick="closeExam()">Return to workshop</button></div>`;
}
function reviewStep(n){closeExam();jump(n-1)}
function downloadDeck(){const blob=new Blob([document.documentElement.outerHTML],{type:"text/html"}),u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download="ultra_messaging_design_persistence_workshop.html";a.click();setTimeout(()=>URL.revokeObjectURL(u),500)}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
window.addEventListener("keydown",e=>{if(e.target.matches("textarea,input,select"))return;if(e.key==="ArrowRight"||e.key==="PageDown")go(1);if(e.key==="ArrowLeft"||e.key==="PageUp")go(-1);if(e.key==="Home")jump(0);if(e.key==="End")jump(SLIDES.length-1);if(e.key.toLowerCase()==="g")openGlossary();if(e.key.toLowerCase()==="r")retryWeak();if(e.key.toLowerCase()==="e")startExam(false);if(e.key==="Escape"){closeGlossary();closeExam()}});
render();
</script>
</body>
</html>
